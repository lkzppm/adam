name: Publish MCP

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-mcp:
    name: publish-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: mcp/adam-context-mcp/package-lock.json

      - name: Install, build, and publish
        working-directory: mcp/adam-context-mcp
        run: |
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
